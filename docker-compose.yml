version: '3.8'

services:
  solax-http:
    build:
      context: .
      dockerfile: Dockerfile
      # For Raspberry Pi 3 64-bit
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: solax-cloud-http
    ports:
      # Published on localhost only by default. To reach it from the LAN set
      # HTTP_BIND_ADDR to the Pi's LAN IP (prefer a TLS reverse proxy in front).
      - "${HTTP_BIND_ADDR:-127.0.0.1}:8000:8000"
    environment:
      # SolaX API credentials (load from .env file)
      SOLAX_CLIENT_ID: ${SOLAX_CLIENT_ID}
      SOLAX_CLIENT_SECRET: ${SOLAX_CLIENT_SECRET}
      SOLAX_DEVICE_SN: ${SOLAX_DEVICE_SN}
      # HTTP server config (0.0.0.0 inside the container; see ports for host exposure)
      TRANSPORT: http
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8000
      # HTTP API authentication
      HTTP_API_KEY: ${HTTP_API_KEY}
      # Solcast PV forecast (optional)
      SOLCAST_API_KEY: ${SOLCAST_API_KEY:-}
      SOLCAST_RESOURCE_IDS: ${SOLCAST_RESOURCE_IDS:-}
      SOLCAST_CACHE_MINUTES: ${SOLCAST_CACHE_MINUTES:-180}
      SOLAR_TIMEZONE: ${SOLAR_TIMEZONE:-UTC}
      # Battery automation (optional, see .env.example)
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-0}
      AUTOMATION_DRY_RUN: ${AUTOMATION_DRY_RUN:-1}
      BATTERY_CAPACITY_KWH: ${BATTERY_CAPACITY_KWH:-}
      AUTOMATION_DAILY_CONSUMPTION_KWH: ${AUTOMATION_DAILY_CONSUMPTION_KWH:-}
      AUTOMATION_CONSUMPTION_PROFILE: ${AUTOMATION_CONSUMPTION_PROFILE:-}
      AUTOMATION_WEEKEND_DAILY_CONSUMPTION_KWH: ${AUTOMATION_WEEKEND_DAILY_CONSUMPTION_KWH:-}
      AUTOMATION_WEEKEND_CONSUMPTION_PROFILE: ${AUTOMATION_WEEKEND_CONSUMPTION_PROFILE:-}
      AUTOMATION_MIN_SOC: ${AUTOMATION_MIN_SOC:-15}
      AUTOMATION_MAX_GRID_SOC: ${AUTOMATION_MAX_GRID_SOC:-100}
      AUTOMATION_SAFETY_MARGIN_KWH: ${AUTOMATION_SAFETY_MARGIN_KWH:-1.0}
      AUTOMATION_EFFICIENCY: ${AUTOMATION_EFFICIENCY:-0.9}
      AUTOMATION_FORECAST_PERCENTILE: ${AUTOMATION_FORECAST_PERCENTILE:-p50}
      AUTOMATION_LEAD_MINUTES: ${AUTOMATION_LEAD_MINUTES:-10}
      TARIFF_OFFPEAK_WINDOWS: ${TARIFF_OFFPEAK_WINDOWS:-22:00-06:00,13:00-15:00}
      TARIFF_OFFPEAK_WEEKENDS: ${TARIFF_OFFPEAK_WEEKENDS:-1}
      TARIFF_OFFPEAK_HOLIDAYS: ${TARIFF_OFFPEAK_HOLIDAYS:-1}
      # Battery export planner (dry run only)
      EXPORT_ENABLED: ${EXPORT_ENABLED:-0}
      EXPORT_MIN_PRICE_PLN_KWH: ${EXPORT_MIN_PRICE_PLN_KWH:-1.0}
      EXPORT_MAX_POWER_KW: ${EXPORT_MAX_POWER_KW:-}
      EXPORT_MIN_SLOT_KWH: ${EXPORT_MIN_SLOT_KWH:-0.2}
      EXPORT_PRICE_MULTIPLIER: ${EXPORT_PRICE_MULTIPLIER:-1.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Uncomment to run MCP mode instead
  # solax-mcp:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   environment:
  #     SOLAX_CLIENT_ID: ${SOLAX_CLIENT_ID}
  #     SOLAX_CLIENT_SECRET: ${SOLAX_CLIENT_SECRET}
  #     SOLAX_DEVICE_SN: ${SOLAX_DEVICE_SN}
  #     # SOLAX_ALLOW_WRITE: "1"   # expose set_battery_self_use_mode tool to the LLM
  #     TRANSPORT: stdio
  #   stdin_open: true
  #   tty: true
  #   restart: unless-stopped
